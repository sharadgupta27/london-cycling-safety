name: london_cycling_safety
version: '1.0'
config-version: 2
profile: london_cycling

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target"]
# Local dev: redirect inside VS Code workspace to avoid the deep-nest Windows lock.
# Production (pipeline.py): override via DBT_PACKAGES_PATH env var if needed.
packages-install-path: "{{ env_var('DBT_PACKAGES_PATH', 'C:/Temp/dbt_packages_london_cycling') }}"

models:
  london_cycling_safety:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

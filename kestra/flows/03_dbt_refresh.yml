# ==============================================================================
# Flow: london_cycling_dbt_refresh
# Namespace: london_cycling
#
# dbt-only refresh – runs dbt without re-ingesting raw data.
# Useful when:
#   • You changed a dbt model and want to test the rebuild without waiting for ingestion
#   • You want to refresh a subset of models (use the dbt_select input)
#   • You need an emergency redeploy of the dbt layer after a hotfix
#
# Steps
# ──────────────────────────────────────────────────────────────────────────────
#   Task 1  dbt_refresh – deps + build (with optional --full-refresh / --select)
#
# Schedule
# ──────────────────────────────────────────────────────────────────────────────
# The schedule below is commented out.  Uncomment it if you always want fresh
# dbt models even on days when no new raw data has arrived.
# ==============================================================================

id: london_cycling_dbt_refresh
namespace: london_cycling

description: |
  Lightweight dbt-only refresh for the London Cycling Safety project.

  Runs dbt deps + dbt build against the existing BigQuery raw data without
  re-ingesting.  Use this for:
    - Testing dbt model changes quickly
    - Rebuilding a specific model subset via the dbt_select input
    - Emergency hotfix deploys of the dbt layer

  No schedule by default – trigger manually or uncomment the schedule trigger.

labels:
  project: london-cycling-safety
  schedule: manual
  target: bigquery

# ── Inputs ────────────────────────────────────────────────────────────────────
inputs:
  - id: dbt_full_refresh
    type: BOOLEAN
    defaults: false
    description: >
      Pass --full-refresh to dbt build.  Drops and fully rebuilds all
      incremental models.  Use sparingly on large BigQuery datasets.

  - id: dbt_select
    type: STRING
    defaults: ""
    description: >
      Optional dbt node selector string (e.g. "staging" or "marts.cycling").
      When non-empty, adds --select <value> to the dbt build command so only
      matching models are built.  Leave blank to build everything.

# ── OPTIONAL SCHEDULE – uncomment to enable ───────────────────────────────────
# triggers:
#   - id: daily_dbt_refresh
#     type: io.kestra.plugin.core.trigger.Schedule
#     cron: "0 5 * * *"           # Every day at 05:00 UTC
#     description: "Daily dbt model refresh at 05:00 UTC."

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 1 – dbt refresh
  #
  # Installs dbt packages then runs dbt build with optional --full-refresh
  # and/or --select flags derived from the flow inputs.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: dbt_refresh
    type: io.kestra.plugin.scripts.python.Commands
    description: "Run dbt deps + dbt build against BigQuery (optional full-refresh / select)."

    docker:
      image: python:3.11-slim

    beforeCommands:
      - pip install "dbt-bigquery>=1.8.0" python-dotenv --quiet

    commands:
      # Step 1: install / update dbt packages (dbt_utils etc.)
      - cd /app && dbt deps --profiles-dir . --project-dir .

      # Step 2: run dbt build with optional flags
      #   --full-refresh  → only appended when inputs.dbt_full_refresh is true
      #   --select <...>  → only appended when inputs.dbt_select is non-empty
      - >-
        cd /app && dbt build
        --profiles-dir . --project-dir . --target prod
        {{ inputs.dbt_full_refresh ? '--full-refresh' : '' }}
        {{ inputs.dbt_select != '' ? '--select ' ~ inputs.dbt_select : '' }}

    env:
      GCP_PROJECT_ID: kestra-dataengg
      GCP_BQ_DATASET: dbt_london_cycling
      GCP_BQ_LOCATION: EU
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
      DBT_PACKAGES_PATH: /tmp/dbt_packages_london_cycling

    retry:
      type: constant
      interval: PT2M
      maxAttempt: 2

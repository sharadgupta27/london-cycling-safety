# ==============================================================================
# Flow: london_cycling_full_pipeline
# Namespace: london_cycling
#
# Full production pipeline – runs on a weekly schedule (Mon 03:00 UTC) and
# can also be triggered manually via the Kestra UI.
#
# Steps
# ──────────────────────────────────────────────────────────────────────────────
#   Task 1  ingest_tfl       – dlt ingests TFL Santander cycling data → BigQuery
#   Task 2  ingest_accidents – dlt ingests UK STATS19 accident data  → BigQuery
#   Task 3  dbt_build        – dbt deps + dbt build (staging → intermediate → marts)
#
# Configuration
# ──────────────────────────────────────────────────────────────────────────────
# All tasks run in fresh Python 3.11-slim Docker containers.
# The project directory (/app) and credentials directory (/credentials) are
# automatically bind-mounted into every container via the plugin.defaults in
# docker-compose.yml – no extra configuration needed here.
#
# Credentials filename: update the GOOGLE_APPLICATION_CREDENTIALS env var in
# each task if your key file has a different name.
# ==============================================================================

id: london_cycling_full_pipeline
namespace: london_cycling

description: |
  Weekly production pipeline for the London Cycling Safety project.

  Runs every Monday at 03:00 UTC.  Can also be triggered manually from
  the Kestra UI with custom parameters.

  Stages:
    1. Ingest TFL Santander cycle-hire journey data   (dlt → BigQuery raw)
    2. Ingest UK STATS19 road accident/casualty data  (dlt → BigQuery raw)
    3. dbt build: staging → intermediate → marts       (BigQuery transforms)

labels:
  project: london-cycling-safety
  schedule: weekly
  target: bigquery

# ── Inputs (can be overridden when triggering manually) ──────────────────────
inputs:
  - id: tfl_n_files
    type: INT
    defaults: 12
    description: >
      Number of most-recent TFL weekly CSV files to download and ingest.
      Each file covers roughly one week of Santander cycle hire journeys.
      Default 12 ≈ 3 months.

  - id: accident_years
    type: STRING
    defaults: "2022,2023,2024"
    description: >
      Comma-separated list of STATS19 years to load (e.g. "2022,2023,2024").
      dlt loads incrementally, so years already ingested are skipped unless
      the underlying data changes.

  - id: dbt_full_refresh
    type: BOOLEAN
    defaults: false
    description: >
      When true, passes --full-refresh to dbt build so all incremental models
      are dropped and fully rebuilt.  Use sparingly – it is slow on large datasets.

# ── Schedule trigger ──────────────────────────────────────────────────────────
triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 1"        # Every Monday at 03:00 UTC
    description: "Weekly run every Monday at 03:00 UTC."
    # To pause the schedule without deleting it, set disabled: true

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 1 – Ingest TFL Santander cycling data
  #
  # Uses dlt to download journey CSV files from cycling.data.tfl.gov.uk and
  # load them into BigQuery (raw.tfl_journeys, raw.tfl_stations).
  # dlt tracks the last-loaded file and skips files already ingested.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: ingest_tfl
    type: io.kestra.plugin.scripts.python.Commands
    description: "Ingest TFL Santander cycle-hire data into BigQuery via dlt."

    docker:
      image: python:3.11-slim

    beforeCommands:
      # Install the BigQuery extra for dlt plus ingestion utilities.
      # Uses --quiet to suppress download noise in Kestra logs.
      - pip install "dlt[bigquery]>=0.5.0" requests beautifulsoup4 pandas python-dotenv loguru tqdm --quiet

    commands:
      - cd /app && python ingestion/ingest_tfl_cycling.py

    env:
      # Tell dlt which destination to use
      DESTINATION: bigquery
      # How many recent weekly files to download (overrides .env default)
      TFL_N_FILES: "{{ inputs.tfl_n_files }}"
      # GCP service-account JSON (mounted read-only from the host credentials dir)
      # Update the filename below if your key file has a different name.
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
      # dlt BigQuery destination configuration
      DESTINATION__BIGQUERY__PROJECT_ID: kestra-dataengg
      DESTINATION__BIGQUERY__LOCATION: EU

    retry:
      type: constant
      interval: PT1M    # wait 1 minute before retrying
      maxAttempt: 2

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 2 – Ingest UK STATS19 road accident data
  #
  # Uses dlt to download DfT STATS19 accident, casualty and vehicle CSV files
  # and load them into BigQuery (raw.uk_accidents, raw.uk_casualties,
  # raw.uk_vehicles), filtered to Greater London.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: ingest_accidents
    type: io.kestra.plugin.scripts.python.Commands
    description: "Ingest UK STATS19 road accident data into BigQuery via dlt."

    docker:
      image: python:3.11-slim

    beforeCommands:
      - pip install "dlt[bigquery]>=0.5.0" requests pandas python-dotenv loguru tqdm --quiet

    commands:
      - cd /app && python ingestion/ingest_uk_accidents.py

    env:
      DESTINATION: bigquery
      # Comma-separated years (e.g. "2022,2023,2024")
      ACCIDENT_YEARS: "{{ inputs.accident_years }}"
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
      DESTINATION__BIGQUERY__PROJECT_ID: kestra-dataengg
      DESTINATION__BIGQUERY__LOCATION: EU

    retry:
      type: constant
      interval: PT1M
      maxAttempt: 2

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 3 – dbt build
  #
  # Runs `dbt deps` (installs dbt packages) then `dbt build` (seeds →
  # staging → intermediate → marts, including tests) against BigQuery.
  #
  # Schemas produced:
  #   dbt_london_cycling_staging      – lightly cleaned raw views
  #   dbt_london_cycling_intermediate – joined / enriched tables
  #   dbt_london_cycling_marts        – final analytics tables for the dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  - id: dbt_build
    type: io.kestra.plugin.scripts.python.Commands
    description: "Run dbt deps + dbt build (staging → intermediate → marts) in BigQuery."

    docker:
      image: python:3.11-slim

    beforeCommands:
      # dbt-bigquery pulls in dbt-core, google-cloud-bigquery and all adapters.
      - pip install "dbt-bigquery>=1.8.0" python-dotenv --quiet

    commands:
      # Install dbt packages (dbt_utils etc.) declared in packages.yml
      - cd /app && dbt deps --profiles-dir . --project-dir .
      # Build all models; optionally add --full-refresh if the input flag is set
      - >-
        cd /app && dbt build
        --profiles-dir . --project-dir . --target prod
        {{ inputs.dbt_full_refresh ? '--full-refresh' : '' }}

    env:
      # Required by profiles.yml BigQuery target
      GCP_PROJECT_ID: kestra-dataengg
      GCP_BQ_DATASET: dbt_london_cycling
      GCP_BQ_LOCATION: EU
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
      # Write dbt packages to /tmp to avoid cluttering the project volume
      DBT_PACKAGES_PATH: /tmp/dbt_packages_london_cycling

    retry:
      type: constant
      interval: PT2M
      maxAttempt: 1   # dbt failures are usually not transient; fix the model first

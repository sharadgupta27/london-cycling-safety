# ==============================================================================
# Flow: london_cycling_backfill
# Namespace: london_cycling
#
# Backfill / historical reload flow – manual trigger only (no schedule).
# Use this flow to:
#   • Load multiple years of historical STATS19 accident data for the first time
#   • Re-ingest a large batch of TFL journey files (e.g. 52 files ≈ 1 year)
#   • Rebuild all dbt incremental models from scratch (--full-refresh)
#
# The `skip_tfl` and `skip_accidents` boolean inputs let you re-run only the
# ingestion source that actually needs backfilling.
#
# Steps
# ──────────────────────────────────────────────────────────────────────────────
#   Task 1  ingest_tfl_backfill       (optional – skipped if skip_tfl=true)
#   Task 2  ingest_accidents_backfill (optional – skipped if skip_accidents=true)
#   Task 3  dbt_rebuild               (always runs; full-refresh by default)
#
# Recommended first-run sequence
# ──────────────────────────────────────────────────────────────────────────────
#   1. In the Kestra UI open this flow and click "Execute".
#   2. Set accident_years = "2019,2020,2021,2022,2023,2024"
#   3. Set tfl_n_files = 52  (≈ 1 year of weekly files)
#   4. Leave dbt_full_refresh = true (default).
#   5. Execute.
# ==============================================================================

id: london_cycling_backfill
namespace: london_cycling

description: |
  Manual backfill / historical reload flow for the London Cycling Safety project.

  Use this flow when you need to:
    - Ingest multiple years of historical STATS19 accident data
    - Load a large batch of TFL Santander journey files
    - Fully rebuild all dbt incremental models from scratch

  This flow has NO schedule – it must be triggered manually from the Kestra UI.

labels:
  project: london-cycling-safety
  schedule: manual
  target: bigquery

# ── Inputs ────────────────────────────────────────────────────────────────────
inputs:
  - id: tfl_n_files
    type: INT
    defaults: 52
    description: >
      Number of TFL weekly CSV files to download for the backfill.
      52 ≈ one full year.  Increase for longer historical periods.

  - id: accident_years
    type: STRING
    defaults: "2019,2020,2021,2022,2023,2024"
    description: >
      Comma-separated list of STATS19 years to backfill.
      All years listed are (re-)loaded; dlt handles deduplication internally.

  - id: skip_tfl
    type: BOOLEAN
    defaults: false
    description: >
      Set to true to skip TFL ingestion and run only STATS19 + dbt.
      Useful when only the accident data needs to be reloaded.

  - id: skip_accidents
    type: BOOLEAN
    defaults: false
    description: >
      Set to true to skip STATS19 ingestion and run only TFL + dbt.
      Useful when only the TFL data needs to be reloaded.

  - id: dbt_full_refresh
    type: BOOLEAN
    defaults: true
    description: >
      Pass --full-refresh to dbt build so all incremental models are dropped
      and fully rebuilt.  Defaults to TRUE for backfill runs.

# No triggers – backfill is always triggered manually.

# ── Tasks ─────────────────────────────────────────────────────────────────────
tasks:

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 1 – Ingest TFL data (conditional on skip_tfl)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: ingest_tfl_branch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.skip_tfl == false }}"

    # Executed when skip_tfl = false (default)
    then:
      - id: ingest_tfl_backfill
        type: io.kestra.plugin.scripts.python.Commands
        description: "Backfill TFL Santander cycle-hire data into BigQuery."

        docker:
          image: python:3.11-slim

        beforeCommands:
          - pip install "dlt[bigquery]>=0.5.0" requests beautifulsoup4 pandas python-dotenv loguru tqdm --quiet

        commands:
          - cd /app && python ingestion/ingest_tfl_cycling.py

        env:
          DESTINATION: bigquery
          TFL_N_FILES: "{{ inputs.tfl_n_files }}"
          GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
          DESTINATION__BIGQUERY__PROJECT_ID: kestra-dataengg
          DESTINATION__BIGQUERY__LOCATION: EU

        retry:
          type: constant
          interval: PT2M
          maxAttempt: 2

    # Executed when skip_tfl = true
    else:
      - id: skip_tfl_log
        type: io.kestra.plugin.core.log.Log
        message: "TFL ingestion skipped (skip_tfl=true)."

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 2 – Ingest STATS19 accident data (conditional on skip_accidents)
  # ─────────────────────────────────────────────────────────────────────────────
  - id: ingest_accidents_branch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.skip_accidents == false }}"

    then:
      - id: ingest_accidents_backfill
        type: io.kestra.plugin.scripts.python.Commands
        description: "Backfill UK STATS19 road accident data into BigQuery."

        docker:
          image: python:3.11-slim

        beforeCommands:
          - pip install "dlt[bigquery]>=0.5.0" requests pandas python-dotenv loguru tqdm --quiet

        commands:
          - cd /app && python ingestion/ingest_uk_accidents.py

        env:
          DESTINATION: bigquery
          ACCIDENT_YEARS: "{{ inputs.accident_years }}"
          GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
          DESTINATION__BIGQUERY__PROJECT_ID: kestra-dataengg
          DESTINATION__BIGQUERY__LOCATION: EU

        retry:
          type: constant
          interval: PT2M
          maxAttempt: 2

    else:
      - id: skip_accidents_log
        type: io.kestra.plugin.core.log.Log
        message: "STATS19 accident ingestion skipped (skip_accidents=true)."

  # ─────────────────────────────────────────────────────────────────────────────
  # Task 3 – dbt rebuild
  #
  # Always runs regardless of which ingestion tasks were skipped.
  # Defaults to --full-refresh so all incremental models are rebuilt.
  # ─────────────────────────────────────────────────────────────────────────────
  - id: dbt_rebuild
    type: io.kestra.plugin.scripts.python.Commands
    description: "Full dbt rebuild (deps + build) in BigQuery – full-refresh by default."

    docker:
      image: python:3.11-slim

    beforeCommands:
      - pip install "dbt-bigquery>=1.8.0" python-dotenv --quiet

    commands:
      - cd /app && dbt deps --profiles-dir . --project-dir .
      - >-
        cd /app && dbt build
        --profiles-dir . --project-dir . --target prod
        {{ inputs.dbt_full_refresh ? '--full-refresh' : '' }}

    env:
      GCP_PROJECT_ID: kestra-dataengg
      GCP_BQ_DATASET: dbt_london_cycling
      GCP_BQ_LOCATION: EU
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/kestra-dataengg-d4b5461e94b4.json
      DBT_PACKAGES_PATH: /tmp/dbt_packages_london_cycling

    retry:
      type: constant
      interval: PT2M
      maxAttempt: 1
